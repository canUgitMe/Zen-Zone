services:
  # === Frontend (React App) ===
  - type: web
    name: zen-zone-frontend
    env: node
    rootDir: frontend   # <-- adjust if your React app is in a subfolder
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build
    envVars:
      - key: REACT_APP_API_URL
        value: https://zen-zone-backend.onrender.com
    autoDeploy: true
    branch: main

  # === Backend (Node.js + MongoDB) ===
  - type: web
    name: zen-zone-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: your_mongodb_atlas_connection_string_here