services:
  # === Frontend (React App) ===
  - type: static
    name: zen-zone-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://zen-zone-backend.onrender.com
    autoDeploy: true
    branch: main

  # === Backend (Node.js + MongoDB) ===
  - type: web
    name: zen-zone-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      # Environment variables for backend
      - key: NODE_ENV
        value: production

      # MongoDB Atlas connection string
      - key: MONGO_URI
        value: your_mongodb_atlas_connection_string_here